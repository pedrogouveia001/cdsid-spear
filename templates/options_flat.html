<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="system_title">SPEAR Decision System</title>
    
    <!-- Google Fonts: Inter and Georgia (serif) for title/header elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    
</head>
<body>
    <!-- Loading Overlay for API Recalculations -->
    <div id="loadingOverlay" style="display: none;">
        <div class="spinner-container">
            <div class="loading-spinner"></div>
            <p id="loadingText" data-i18n="recalculating">Recalculating partial results...</p>
        </div>
    </div>

    <header class="app-header">
        <div class="header-logo">
            <span class="logo-text">SPEAR</span>
        </div>
        <div class="header-controls">
            <!-- Language toggle button -->
            <button id="langToggle" class="header-control-btn" aria-label="Change Language / Mudar Idioma">
                <span id="langIcon">🇺🇸</span>
            </button>
            <!-- Theme toggle button -->
            <button id="themeToggle" class="header-control-btn" aria-label="Toggle Theme / Alternar Tema">
                <span id="themeIcon">☀️</span>
            </button>
            <span class="header-version">SE-M1EN-EWT1</span>
        </div>
    </header>

    <nav class="sub-nav">
        <div class="sub-nav-left">
            
<a href="/logout" class="back-link">&lt;&lt; Back</a>

        </div>
        <div class="sub-nav-right">
            
                <span class="user-info"><span data-i18n="user">User</span>: {%lblUserEmail%}</span>
                <a href="/logout" class="logout-link" data-i18n="logout">Logout</a>
            
        </div>
    </nav>
    
    <main class="container">
        
<div class="options-container">
    <h2 class="options-header" data-i18n="choose_option">Please, choose an option:</h2>
    
    <div class="options-row">
        <!-- Card 1: Register new problem -->
        <div class="option-card">
            <div class="option-icon">
                <!-- SVG Document with Plus Sign -->
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#003366" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="12" y1="18" x2="12" y2="12"></line>
                    <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
            </div>
            {%btnNewProblem%}
        </div>
        
        <!-- Card 2: Continue a registered issue -->
        <div class="option-card">
            <div class="option-icon">
                <!-- SVG Document with Arrow -->
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#006699" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <polyline points="9 15 12 15 12 12"></polyline>
                    <path d="M12 15l4-4"></path>
                </svg>
            </div>
            {%btnContinueProblem%}
        </div>
    </div>
</div>

    </main>
    
    <footer class="app-footer">
        <div class="footer-logos">
            <!-- inct/insid logo -->
            <img class="footer-logo-img" src="/static/img/inct_insid.png" alt="INCT / INSID Logo" style="height: 45px; width: auto; max-width: 100%;">
            <!-- cdsid logo -->
            <img class="footer-logo-img" src="/static/img/cdsid.png" alt="CDSID Logo" style="height: 45px; width: auto; max-width: 100%;">
        </div>
    </footer>
    
    <!-- Custom JS -->
    <script src="/static/js/app.js?v=74274"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</body>
</html>
