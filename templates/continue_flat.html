<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="system_title">SPEAR Decision System</title>
    
    <!-- Google Fonts: Inter and Georgia (serif) for title/header elements -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    
</head>
<body>
    <!-- Loading Overlay for API Recalculations -->
    <div id="loadingOverlay" style="display: none;">
        <div class="spinner-container">
            <div class="loading-spinner"></div>
            <p id="loadingText" data-i18n="recalculating">Recalculating partial results...</p>
        </div>
    </div>

    <header class="app-header">
        <div class="header-logo">
            <span class="logo-text">SPEAR</span>
        </div>
        <div class="header-controls">
            <!-- Language toggle button -->
            <button id="langToggle" class="header-control-btn" aria-label="Change Language / Mudar Idioma">
                <span id="langIcon">🇺🇸</span>
            </button>
            <!-- Theme toggle button -->
            <button id="themeToggle" class="header-control-btn" aria-label="Toggle Theme / Alternar Tema">
                <span id="themeIcon">☀️</span>
            </button>
            <span class="header-version">SE-M1EN-EWT1</span>
        </div>
    </header>

    <nav class="sub-nav">
        <div class="sub-nav-left">
            
{%btnBack%}

        </div>
        <div class="sub-nav-right">
            
                <span class="user-info"><span data-i18n="user">User</span>: {%lblUserEmail%}</span>
                <a href="/logout" class="logout-link" data-i18n="logout">Logout</a>
            
        </div>
    </nav>
    
    <main class="container">
        
<div class="continue-container">
    <div class="continue-card">
        <h2 class="continue-title" data-i18n="continue_registered_issue">Continue a registered issue</h2>
        
        <div class="problem-list-wrapper">
            <div id="problemSelect" class="problem-listbox">
                {%ProblemList%}
            </div>
        </div>
        
        <div style="display:none;">
            {%edtSelectedProblemId%}
            {%btnSelect%}
        </div>
        
        <div class="continue-actions">
            <span class="wait-note" data-i18n="wait_note">*It can take a few seconds, please wait.</span>
            <button id="btnSelectProblem" class="btn btn-delphi-action" data-i18n="select">Select</button>
        </div>
    </div>
</div>

    </main>
    
    <footer class="app-footer">
        <div class="footer-logos">
            <!-- inct/insid logo -->
            <img class="footer-logo-img" src="/static/img/inct_insid.png" alt="INCT / INSID Logo" style="height: 45px; width: auto; max-width: 100%;">
            <!-- cdsid logo -->
            <img class="footer-logo-img" src="/static/img/cdsid.png" alt="CDSID Logo" style="height: 45px; width: auto; max-width: 100%;">
        </div>
    </footer>
    
    <!-- Custom JS -->
    <script src="/static/js/app.js?v=32357"></script>
    
<script>
document.addEventListener('DOMContentLoaded', function() {
    const btnSelectProblem = document.getElementById('btnSelectProblem');
    const problemSelect = document.getElementById('problemSelect');
    let selectedId = '';
    
    if (problemSelect) {
        problemSelect.addEventListener('click', function(e) {
            const option = e.target.closest('.problem-option');
            if (option && !option.classList.contains('disabled')) {
                problemSelect.querySelectorAll('.problem-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                option.classList.add('selected');
                selectedId = option.getAttribute('data-value');
            }
        });
        
        problemSelect.addEventListener('dblclick', function(e) {
            const option = e.target.closest('.problem-option');
            if (option && !option.classList.contains('disabled')) {
                problemSelect.querySelectorAll('.problem-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                option.classList.add('selected');
                selectedId = option.getAttribute('data-value');
                btnSelectProblem.click();
            }
        });
    }
    
    btnSelectProblem.addEventListener('click', function() {
        if (!selectedId) {
            const lang = localStorage.getItem('spear_lang') || 'en';
            alert(lang === 'pt' ? 'Por favor, selecione um problema primeiro.' : 'Please select a problem first.');
            return;
        }
        
        const edt = document.getElementById('{%edtSelectedProblemId.HTMLName%}');
        if (edt) edt.value = selectedId;
        
        const btn = document.getElementById('{%btnSelect.HTMLName%}');
        if (btn) btn.click();
    });
});
</script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</body>
</html>
